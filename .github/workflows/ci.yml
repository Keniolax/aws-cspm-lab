name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest scripts/ -q

  # The static before/after pair, re-run on every push with no AWS credentials:
  # Checkov must flag the deliberate misconfigurations in modules/vuln and
  # must pass modules/fixed apart from the documented, accepted findings.
  checkov-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install checkov==3.4.3
      - name: checkov must flag the vuln module
        run: |
          set +e
          checkov -d modules/vuln --framework terraform --quiet > vuln.log 2>&1
          code=$?
          set -e
          tail -5 vuln.log
          if [ "$code" -eq 0 ]; then
            echo "checkov found nothing in modules/vuln: the deliberate misconfigurations are gone"
            exit 1
          fi
      - name: checkov must pass the fixed module apart from accepted findings
        run: |
          checkov -d modules/fixed --framework terraform --quiet \
            --skip-check "CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV_AWS_252,CKV_AWS_35,CKV2_AWS_5,CKV2_AWS_10,CKV2_AWS_61,CKV2_AWS_62"